# ==========================================  CFPA configuration for MCXN947  ==========================================


# -------------------------------------------------------- Note --------------------------------------------------------
# `RAW:` prefix is used to avoid any conversions of the value. With `RAW:` the value will be written as it is displayed
# in the config file.
# ======================================================================================================================
#                                                 == General Options ==                                                 
# ======================================================================================================================
# -------------------------------------===== The chip family name [Required] =====--------------------------------------
# Description: NXP chip family identifier.
family: mcxn947
# ------------------------------------===== Configuration area type [Required] =====------------------------------------
# Description: PFR / IFR type
# Possible options: <CFPA, cfpa>
type: cfpa
# --------------------------------------------===== mcxn947 [Required] =====--------------------------------------------
settings:
  # -------------------------------------------===== Header [Optional] =====--------------------------------------------
  # Description: Offset: 0x00000000, Width: 32b; CFPA Header
  Header:
    # ---------------------------------------===== CFPA_LC_STATE [Optional] =====---------------------------------------
    # Description: Offset: 0b, Width: 8b, Life cycle state. This field can be used to advance life cycle state to 0x7,
    # 0xF or 0xCF during development (OTP_LC_STATE = 0x3) for testing deployed states without programming OTP fuse. When
    # CFPA is used to advance LC state, then application code should implement hooks, to revert CFPA_LC_STATE field to
    # 0x3 to bring the device back to OEM_DEVELOP state (0x03). One such example is a GPIO interrupt handler invoked on
    # a button press which modified the CFPA_LC_STATE to 0x3. Below are the allowed values for this field. Use of other
    # values may lead to bricked state
    # - USE_LC_STATE_OTP, (0): Use LC state from OTP
    # - DEVELOP, (3): Develop state
    # - DEVELOP2, (7): Develop 2 state
    # - IN_FIELD, (15): In-field state
    # - IN_FIELD_LOCKED, (207): In-field locked state
    # Possible options: <USE_LC_STATE_OTP, DEVELOP, DEVELOP2, IN_FIELD, IN_FIELD_LOCKED>
    CFPA_LC_STATE: RAW:0x00
    # -------------------------------------===== INV_CFPA_LC_STATE [Optional] =====-------------------------------------
    # Description: Offset: 8b, Width: 8b, Inverted value of CFPA_LC_STATE. This INV_CPFA_LC_STATE ^ CFPA_LC_STATE[7:0]
    # should be 0xFF, otherwise the CPFA_LC_STATE will not be valid
    INV_CFPA_LC_STATE: RAW:0x00
    # ----------------------------------------===== CFPA_HEADER [Optional] =====----------------------------------------
    # Description: Offset: 16b, Width: 16b, CFPA Header marker should be set to 0x9635. After this header is set, all
    # non-zero values will take effect; leaving all values set to 0xff will cause undefined behavior. It is recommended
    # to set all values to 0x00 before setting the CFPA header
    CFPA_HEADER: RAW:0x9635
  # --------------------------------------===== CFPA_PAGE_VERSION [Optional] =====--------------------------------------
  # Description: Offset: 0x00000004, Width: 32b; CFPA Page Version.
  CFPA_PAGE_VERSION:
    # -------------------------------------===== CFPA_page_version [Optional] =====-------------------------------------
    # Description: Offset: 0b, Width: 24b, CFPA page version. Boot ROM uses this field to determine the active CFPA page
    # by comparing the values in this field for the two CFPA pages. The page with higher version number is picked as
    # active page if it passes the CMAC authentication. This field is updated by ROM whenever CFPA page is updated.
    # Write '0xFF_FFFF' to auto increment current CFPA page version value (by ROM)
    CFPA_page_version: RAW:0xff_ffff
    # ------------------------------------------===== IMG_UPD [Optional] =====------------------------------------------
    # Description: Offset: 24b, Width: 2b, Image updated. Note: CMAC boot is only supported for internal flash. If using
    # a FlexSPI flash XIP image, then this field should always be left as zero
    # - NOTHING_CHANGED, (0): No action
    # - IMAGE0_CMAC_UPDATE, (1): Update image 0 CMAC
    # - IMAGE1_CMAC_UPDATE, (2): Update image 1 CMAC
    # - SBL_IMG_CMAC_UPDATE, (3): Update SBL image CMAC (image in IFR0 0x0100_8000). Value written in IMG0_CMAC field
    # Possible options: <NOTHING_CHANGED, IMAGE0_CMAC_UPDATE, IMAGE1_CMAC_UPDATE, SBL_IMG_CMAC_UPDATE>
    IMG_UPD: RAW:0b00
    # -----------------------------------------===== CMPA_UPD [Optional] =====------------------------------------------
    # Description: Offset: 27b, Width: 3b, CMPA page updated through ROM API. Thus compute CMAC on sub-sequent boot.
    # This field is checked only in Develop (0x3) LC state. All other combinations update CMAC field in CMPA page
    # - NO_ACTION, (0): No action
    # - UPDATE_IN_CMPA, (2): Update CMAC field in CMPA page
    # - TO_OEM_SECURE, (3): Update CMAC field in CMPA page and OTP. Advance OTP_LC_STATE to Develop2 (0x7)
    # - TO_OEM_CLOSED, (5): Update CMAC field in CMPA page and OTP. Advance OTP_LC_STATE to In-Field (0xF)
    # - TO_OEM_LOCKED, (6): Update CMAC field in CMPA page and OTP. Advance OTP_LC_STATE to In-Field Locked (0xCF)
    # Possible options: <NO_ACTION, UPDATE_IN_CMPA, TO_OEM_SECURE, TO_OEM_CLOSED, TO_OEM_LOCKED>
    CMPA_UPD: RAW:0b000
    # -----------------------------------------===== DICE_UPD [Optional] =====------------------------------------------
    # Description: Offset: 31b, Width: 1b, Update DICE certificate during next boot
    # - NO_ACTION, (0): No action
    # - GENERATE_CERTIFICATE, (1): Generate certificate
    # Possible options: <NO_ACTION, GENERATE_CERTIFICATE>
    DICE_UPD: RAW:0b0
  # --------------------------------------===== Secure_FW_Version [Optional] =====--------------------------------------
  # Description: Offset: 0x00000008, Width: 32b; Secure Firmware version. This monotonic counter field tracks the
  # firmware version of secure partition. ROM uses this field to enforce anti-rollback checking during secure boot and
  # secure update (SB3 header). For image authentication pass during secure boot the FW version in image manifest must
  # be equal or greater than this value. During secure update and recovery boot the version number in SB3 header Must be
  # equal or greater than the value in this field. Apart from SB3 header check, user can enforce anti-rollback check
  # during SB3 processing by using 'kSB3_COMMAND_fwVersionCheck' SB command with 'kNBOOT_CNT_secure' counter ID
  # parameter, in SB3 file.
  Secure_FW_Version:
    # ----------------------------------===== Secure_firmware_version [Optional] =====----------------------------------
    # Description: Offset: 0b, Width: 16b, Secure Firmware version. This monotonic counter field tracks the firmware
    # version of secure partition. ROM uses this field to enforce anti-rollback checking during secure boot and secure
    # update (SB3 header). For image authentication pass during secure boot the FW version in image manifest must be
    # equal or greater than this value. During secure update & recovery boot the version number in SB3 header Must be
    # equal or greater than the value in this field. Apart from SB3 header check, user can enforce anti-rollback check
    # during SB3 processing by using "kSB3_COMMAND_fwVersionCheck" SB command with 'kNBOOT_CNT_secure' counter ID
    # parameter, in SB3 file
    Secure_firmware_version: RAW:0x0000
  # ----------------------------------------===== NS_FW_Version [Optional] =====----------------------------------------
  # Description: Offset: 0x0000000C, Width: 32b; Non-Secure Firmware version. This monotonic counter field can be used
  # to track the firmware version of non-secure partition. An anti-rollback check can be enforced during update by using
  # this field and 'kSB3_COMMAND_fwVersionCheck' SB command with 'kNBOOT_CNT_nonsecure' counter ID parameter, in SB3
  # file.
  NS_FW_Version: '0x0000_0000'
  # ----------------------------------------===== SECBOOT_FLAGS [Optional] =====----------------------------------------
  # Description: Offset: 0x00000014, Width: 32b; Secure BOOT Flags.
  SECBOOT_FLAGS:
    # -----------------------------------------===== RoTK0_EN [Optional] =====------------------------------------------
    # Description: Offset: 0b, Width: 2b, Root of Trust Key 0 Enable. Determines if ROTK0 can be used during secure boot
    # - ENABLED_0, (0): Enabled
    # - ENABLED_1, (1): Enabled
    # - KEY_REVOKED_2, (2): Key revoked
    # - KEY_REVOKED_3, (3): Key revoked
    # Possible options: <ENABLED_0, ENABLED_1, KEY_REVOKED_2, KEY_REVOKED_3>
    RoTK0_EN: RAW:0b00
    # -----------------------------------------===== RoTK1_EN [Optional] =====------------------------------------------
    # Description: Offset: 2b, Width: 2b, Root of Trust Key 1 Enable. Determines if ROTK1 can be used during secure boot
    # - ENABLED_0, (0): Enabled
    # - ENABLED_1, (1): Enabled
    # - KEY_REVOKED_2, (2): Key revoked
    # - KEY_REVOKED_3, (3): Key revoked
    # Possible options: <ENABLED_0, ENABLED_1, KEY_REVOKED_2, KEY_REVOKED_3>
    RoTK1_EN: RAW:0b00
    # -----------------------------------------===== RoTK2_EN [Optional] =====------------------------------------------
    # Description: Offset: 4b, Width: 2b, Root of Trust Key 2 Enable. Determines if ROTK2 can be used during secure boot
    # - ENABLED_0, (0): Enabled
    # - ENABLED_1, (1): Enabled
    # - KEY_REVOKED_2, (2): Key revoked
    # - KEY_REVOKED_3, (3): Key revoked
    # Possible options: <ENABLED_0, ENABLED_1, KEY_REVOKED_2, KEY_REVOKED_3>
    RoTK2_EN: RAW:0b00
    # -----------------------------------------===== RoTK3_EN [Optional] =====------------------------------------------
    # Description: Offset: 6b, Width: 2b, Root of Trust Key 3 Enable. Determines if ROTK3 can be used during secure boot
    # - ENABLED_0, (0): Enabled
    # - ENABLED_1, (1): Enabled
    # - KEY_REVOKED_2, (2): Key revoked
    # - KEY_REVOKED_3, (3): Key revoked
    # Possible options: <ENABLED_0, ENABLED_1, KEY_REVOKED_2, KEY_REVOKED_3>
    RoTK3_EN: RAW:0b00
    # -----------------------------------===== OEM_RETURN_ERASE_DONE [Optional] =====-----------------------------------
    # Description: Offset: 28b, Width: 4b, OEM assets erase done flag. ROM sets this field to 0xA after erasing the user
    # flash and OEM assets. This operation is done on first boot after OTP_LC_STATE is advanced to 0x1F or higher
    # states. On every boot ROM checks if LC_STATE is greater or equal to 0x1F and this field is empty in active CFPA
    # page, then it erases OEM assets and updates this field in CFPA before freezing CFPA pages and enabling debug
    # access. If the field is already set to 0xA then it proceeds without erasing user flash area
    OEM_RETURN_ERASE_DONE: RAW:0b0000
  # --------------------------------------===== IMAGE_KEY_REVOKE [Optional] =====---------------------------------------
  # Description: Offset: 0x00000018, Width: 32b; Image Key Revoke
  IMAGE_KEY_REVOKE:
    # ----------------------------------===== Image_key_revocation_ID [Optional] =====----------------------------------
    # Description: Offset: 0b, Width: 24b, Image signing key revocation counter. This monotonically increasing unary
    # encode counter (e.g., 0x0, 0x1, 0x3, 0x7, 0xF...) field is used by boot ROM to enforce image signing key (ISK)
    # certificate revocation policy. Boot ROM accepts an ISK certificate as valid only if the "constraint" field in ISK
    # certificate is the same or greater than the ISK revocation counter. The 32-bit ISK revocation counter is formed
    # using 8 bits of IMAGE_KEY_REVOKE[7:0] field in OTP as MSB bits and lower 24 bits from this field. ISK certificate
    # validation is done as part of boot, FW update (SB3) and recovery (SB3) image authentication
    Image_key_revocation_ID: RAW:0x00_0000
  # ---------------------------------------===== LP_VECTOR_ADDR [Optional] =====----------------------------------------
  # Description: Offset: 0x0000001C, Width: 32b; Vector address when waking from power-down and deep power down states
  # when CMPA.LP_SEC_BOOT is set to 2b'10.
  LP_VECTOR_ADDR: '0x0000_0000'
  # ----------------------------------------===== DBG_REVOKE_VU [Optional] =====----------------------------------------
  # Description: Offset: 0x00000020, Width: 32b; Debug Revoke Vendor Usage.
  DBG_REVOKE_VU:
    # ---------------------------===== Debug_certificate_revocation_counter [Optional] =====----------------------------
    # Description: Offset: 0b, Width: 16b, Debug certificate revocation counter. This monotonic counter field is used
    # for revoking debug certificates. As part of debug authentication, CC_VU field in debug certificate/credential is
    # checked against DCFG_VENDOR_USAGE value. The 32-bit DCFG_VENDOR_USAGE is formed using upper 16 bit of
    # CMPA.VENDOR_USAGE and lower 16 bits of this field
    Debug_certificate_revocation_counter: RAW:0x0000
    # ---------------------------------------===== Inverse_value [Optional] =====---------------------------------------
    # Description: Offset: 16b, Width: 16b, Inverse Value of [15:0]
    Inverse_value: RAW:0x0000
  # -------------------------------------===== DCFG_CC_SOCU_NS_PIN [Optional] =====-------------------------------------
  # Description: Offset: 0x00000024, Width: 32b; Device Configuration Credential Constraints for SoC specific Use
  # Pinned. With TZ-M, the part can be sold by level 1 customers (secure code developer) to level-2 customers who
  # develops non-secure code only. - In this scenario, for ease of development, Level 1 customer releases the part to
  # always allow non-secure debug. - To allow level-2 customers to further seal the part DCFG_CC_SOCU_NS is used. - ROM
  # will use this word to further restrict the debug access.
  DCFG_CC_SOCU_NS_PIN:
    # -------------------------------------------===== NIDEN [Optional] =====-------------------------------------------
    # Description: Offset: 0b, Width: 1b, Non Secure non-invasive debug enable
    # - USE_DAP, (0): Use DAP to enable
    # - FIXED_STATE, (1): Fixed state
    # Possible options: <USE_DAP, FIXED_STATE>
    NIDEN: RAW:0b0
    # -------------------------------------------===== DBGEN [Optional] =====-------------------------------------------
    # Description: Offset: 1b, Width: 1b, Non Secure debug enable
    # - USE_DAP, (0): Use DAP to enable
    # - FIXED_STATE, (1): Fixed state
    # Possible options: <USE_DAP, FIXED_STATE>
    DBGEN: RAW:0b0
    # ------------------------------------------===== SPNIDEN [Optional] =====------------------------------------------
    # Description: Offset: 2b, Width: 1b, Secure non-invasive debug enable
    # - USE_DAP, (0): Use DAP to enable
    # - FIXED_STATE, (1): Fixed state
    # Possible options: <USE_DAP, FIXED_STATE>
    SPNIDEN: RAW:0b0
    # ------------------------------------------===== SPIDEN [Optional] =====-------------------------------------------
    # Description: Offset: 3b, Width: 1b, Secure invasive debug enable
    # - USE_DAP, (0): Use DAP to enable
    # - FIXED_STATE, (1): Fixed state
    # Possible options: <USE_DAP, FIXED_STATE>
    SPIDEN: RAW:0b0
    # -----------------------------------------===== DSP_DBGEN [Optional] =====-----------------------------------------
    # Description: Offset: 5b, Width: 1b, DSP debug enable CoolFlex debug
    # - USE_DAP, (0): Use DAP to enable
    # - FIXED_STATE, (1): Fixed state
    # Possible options: <USE_DAP, FIXED_STATE>
    DSP_DBGEN: RAW:0b0
    # ----------------------------------------===== ISP_CMD_EN [Optional] =====-----------------------------------------
    # Description: Offset: 6b, Width: 1b, ISP boot command enable
    # - USE_DAP, (0): Use DAP to enable
    # - FIXED_STATE, (1): Fixed state
    # Possible options: <USE_DAP, FIXED_STATE>
    ISP_CMD_EN: RAW:0b0
    # -----------------------------------------===== FA_CMD_EN [Optional] =====-----------------------------------------
    # Description: Offset: 7b, Width: 1b, Set FA mode command enable
    # - USE_DAP, (0): Use DAP to enable
    # - FIXED_STATE, (1): Fixed state
    # Possible options: <USE_DAP, FIXED_STATE>
    FA_CMD_EN: RAW:0b0
    # -----------------------------------------===== ME_CMD_EN [Optional] =====-----------------------------------------
    # Description: Offset: 8b, Width: 1b, Flash Mass Erase Command Enable
    # - USE_DAP, (0): Use DAP to enable
    # - FIXED_STATE, (1): Fixed state
    # Possible options: <USE_DAP, FIXED_STATE>
    ME_CMD_EN: RAW:0b0
    # ----------------------------------------===== CPU1_NIDEN [Optional] =====-----------------------------------------
    # Description: Offset: 9b, Width: 1b, Second CM33 non-invasive debug enable
    # - USE_DAP, (0): Use DAP to enable
    # - FIXED_STATE, (1): Fixed state
    # Possible options: <USE_DAP, FIXED_STATE>
    CPU1_NIDEN: RAW:0b0
    # ----------------------------------------===== CPU1_DBGEN [Optional] =====-----------------------------------------
    # Description: Offset: 10b, Width: 1b, Second CM33 debug Fixed state
    # - USE_DAP, (0): Use DAP to enable
    # - FIXED_STATE, (1): Fixed state
    # Possible options: <USE_DAP, FIXED_STATE>
    CPU1_DBGEN: RAW:0b0
    # ----------------------------------------===== UUID_CHECK [Optional] =====-----------------------------------------
    # Description: Offset: 15b, Width: 1b, Enforce UUID match during Debug authentication
    # - DISABLED, (0): Debug certificate can be used with all devices
    # - ENABLED, (1): Debug certificate per device with matching UUID is needed
    # Possible options: <DISABLED, ENABLED>
    UUID_CHECK: RAW:0b0
    # ---------------------------------------===== Inverse_value [Optional] =====---------------------------------------
    # Description: Offset: 16b, Width: 16b, Inverse Value of [15:0]
    Inverse_value: RAW:0x0000
  # ------------------------------------===== DCFG_CC_SOCU_NS_DFLT [Optional] =====-------------------------------------
  # Description: Offset: 0x00000028, Width: 32b; Device Configuration Credential Constraints for SoC specific Use Debug
  # Filter. With TZ-M, the part can be sold by level 1 customers (secure code developer) to level-2 customers who
  # develops non-secure code only. - In this scenario, or easy of development, Level-I customer releases the part to
  # always allow non-secure debug. - To allow level-2 customers to further seal the part DCFG_CC_SOCU_NS is used. - ROM
  # will use this word to further restrict the debug access.
  DCFG_CC_SOCU_NS_DFLT:
    # -------------------------------------------===== NIDEN [Optional] =====-------------------------------------------
    # Description: Offset: 0b, Width: 1b, Non Secure non-invasive debug Fixed state
    # - DISABLED, (0): Disabled
    # - ENABLED, (1): Enabled
    # Possible options: <DISABLED, ENABLED>
    NIDEN: RAW:0b0
    # -------------------------------------------===== DBGEN [Optional] =====-------------------------------------------
    # Description: Offset: 1b, Width: 1b, Non Secure debug Fixed state
    # - DISABLED, (0): Disabled
    # - ENABLED, (1): Enabled
    # Possible options: <DISABLED, ENABLED>
    DBGEN: RAW:0b0
    # ------------------------------------------===== SPNIDEN [Optional] =====------------------------------------------
    # Description: Offset: 2b, Width: 1b, Secure non-invasive debug Fixed state
    # - DISABLED, (0): Disabled
    # - ENABLED, (1): Enabled
    # Possible options: <DISABLED, ENABLED>
    SPNIDEN: RAW:0b0
    # ------------------------------------------===== SPIDEN [Optional] =====-------------------------------------------
    # Description: Offset: 3b, Width: 1b, Secure invasive debug Fixed state
    # - DISABLED, (0): Disabled
    # - ENABLED, (1): Enabled
    # Possible options: <DISABLED, ENABLED>
    SPIDEN: RAW:0b0
    # -----------------------------------------===== DSP_DBGEN [Optional] =====-----------------------------------------
    # Description: Offset: 5b, Width: 1b, DSP debug enable CoolFlex debug
    # - DISABLED, (0): Disabled
    # - ENABLED, (1): Enabled
    # Possible options: <DISABLED, ENABLED>
    DSP_DBGEN: RAW:0b0
    # ----------------------------------------===== ISP_CMD_EN [Optional] =====-----------------------------------------
    # Description: Offset: 6b, Width: 1b, ISP Boot Command Fixed State
    # - DISABLED, (0): Disabled
    # - ENABLED, (1): Enabled
    # Possible options: <DISABLED, ENABLED>
    ISP_CMD_EN: RAW:0b0
    # -----------------------------------------===== FA_CMD_EN [Optional] =====-----------------------------------------
    # Description: Offset: 7b, Width: 1b, Set FA mode command Fixed state
    # - DISABLED, (0): Disabled
    # - ENABLED, (1): Enabled
    # Possible options: <DISABLED, ENABLED>
    FA_CMD_EN: RAW:0b0
    # -----------------------------------------===== ME_CMD_EN [Optional] =====-----------------------------------------
    # Description: Offset: 8b, Width: 1b, Mass erase flash command fixed state
    # - DISABLED, (0): Disabled
    # - ENABLED, (1): Enabled
    # Possible options: <DISABLED, ENABLED>
    ME_CMD_EN: RAW:0b0
    # ----------------------------------------===== CPU1_NIDEN [Optional] =====-----------------------------------------
    # Description: Offset: 9b, Width: 1b, Second CM33 non-invasive debug Fixed state
    # - DISABLED, (0): Disabled
    # - ENABLED, (1): Enabled
    # Possible options: <DISABLED, ENABLED>
    CPU1_NIDEN: RAW:0b0
    # ----------------------------------------===== CPU1_DBGEN [Optional] =====-----------------------------------------
    # Description: Offset: 10b, Width: 1b, Second CM33 debug Fixed state
    # - DISABLED, (0): Disabled
    # - ENABLED, (1): Enabled
    # Possible options: <DISABLED, ENABLED>
    CPU1_DBGEN: RAW:0b0
    # ---------------------------------------===== Inverse_value [Optional] =====---------------------------------------
    # Description: Offset: 16b, Width: 16b, Inverse Value of [15:0]
    Inverse_value: RAW:0x0000
  # ---------------------------------------===== MCTR_CUST_CTR0 [Optional] =====----------------------------------------
  # Description: Offset: 0x00000080, Width: 32b; Customer defined Monotonic counter 0 for application use. ROM enforces
  # monotonic increment check during CFPA-CMAC page update. If the new counter value is less than the value in active
  # CFPA page, then the update is rejected and CMAC signing is skipped.
  MCTR_CUST_CTR0: '0x0000_0000'
  # ---------------------------------------===== MCTR_CUST_CTR1 [Optional] =====----------------------------------------
  # Description: Offset: 0x00000084, Width: 32b; Customer defined Monotonic counter 1 for application use. ROM enforces
  # monotonic increment check during CFPA-CMAC page update. If the new counter value is less than the value in active
  # CFPA page, then the update is rejected and CMAC signing is skipped.
  MCTR_CUST_CTR1: '0x0000_0000'
  # ---------------------------------------===== MCTR_CUST_CTR2 [Optional] =====----------------------------------------
  # Description: Offset: 0x00000088, Width: 32b; Customer defined Monotonic counter 2 for application use. ROM enforces
  # monotonic increment check during CFPA-CMAC page update. If the new counter value is less than the value in active
  # CFPA page, then the update is rejected and CMAC signing is skipped.
  MCTR_CUST_CTR2: '0x0000_0000'
  # ---------------------------------------===== MCTR_CUST_CTR3 [Optional] =====----------------------------------------
  # Description: Offset: 0x0000008C, Width: 32b; Customer defined Monotonic counter 3 for application use. ROM enforces
  # monotonic increment check during CFPA-CMAC page update. If the new counter value is less than the value in active
  # CFPA page, then the update is rejected and CMAC signing is skipped.
  MCTR_CUST_CTR3: '0x0000_0000'
  # ---------------------------------------===== MCTR_CUST_CTR4 [Optional] =====----------------------------------------
  # Description: Offset: 0x00000090, Width: 32b; Customer defined Monotonic counter 4 for application use. ROM enforces
  # monotonic increment check during CFPA-CMAC page update. If the new counter value is less than the value in active
  # CFPA page, then the update is rejected and CMAC signing is skipped.
  MCTR_CUST_CTR4: '0x0000_0000'
  # ---------------------------------------===== MCTR_CUST_CTR5 [Optional] =====----------------------------------------
  # Description: Offset: 0x00000094, Width: 32b; Customer defined Monotonic counter 5 for application use. ROM enforces
  # monotonic increment check during CFPA-CMAC page update. If the new counter value is less than the value in active
  # CFPA page, then the update is rejected and CMAC signing is skipped.
  MCTR_CUST_CTR5: '0x0000_0000'
  # ---------------------------------------===== MCTR_CUST_CTR6 [Optional] =====----------------------------------------
  # Description: Offset: 0x00000098, Width: 32b; Customer defined Monotonic counter 6 for application use. ROM enforces
  # monotonic increment check during CFPA-CMAC page update. If the new counter value is less than the value in active
  # CFPA page, then the update is rejected and CMAC signing is skipped.
  MCTR_CUST_CTR6: '0x0000_0000'
  # ---------------------------------------===== MCTR_CUST_CTR7 [Optional] =====----------------------------------------
  # Description: Offset: 0x0000009C, Width: 32b; Customer defined Monotonic counter 7 for application use. ROM enforces
  # monotonic increment check during CFPA-CMAC page update. If the new counter value is less than the value in active
  # CFPA page, then the update is rejected and CMAC signing is skipped.
  MCTR_CUST_CTR7: '0x0000_0000'
  # ----------------------------------------===== MFLAG_CUST_0 [Optional] =====-----------------------------------------
  # Description: Offset: 0x000000A0, Width: 32b; Customer defined Monotonic flags 0 for application use. Once a bit is
  # set in this field it should be set on sub-sequent updates of the page. ROM emulates One Time Programmable (OTP) bits
  # behavior during CFPA-CMAC update. Compared to current value, if the new value has bit cleared, then the update is
  # rejected and CMAC signing is skipped.
  MFLAG_CUST_0: '0x0000_0000'
  # ----------------------------------------===== MFLAG_CUST_1 [Optional] =====-----------------------------------------
  # Description: Offset: 0x000000A4, Width: 32b; Customer defined Monotonic flags 1 for application use. Once a bit is
  # set in this field it should be set on sub-sequent updates of the page. ROM emulates One Time Programmable (OTP) bits
  # behavior during CFPA-CMAC update. Compared to current value, if the new value has bit cleared, then the update is
  # rejected and CMAC signing is skipped.
  MFLAG_CUST_1: '0x0000_0000'
  # ----------------------------------------===== MFLAG_CUST_2 [Optional] =====-----------------------------------------
  # Description: Offset: 0x000000A8, Width: 32b; Customer defined Monotonic flags 2 for application use. Once a bit is
  # set in this field it should be set on sub-sequent updates of the page. ROM emulates One Time Programmable (OTP) bits
  # behavior during CFPA-CMAC update. Compared to current value, if the new value has bit cleared, then the update is
  # rejected and CMAC signing is skipped.
  MFLAG_CUST_2: '0x0000_0000'
  # ----------------------------------------===== MFLAG_CUST_3 [Optional] =====-----------------------------------------
  # Description: Offset: 0x000000AC, Width: 32b; Customer defined Monotonic flags 3 for application use. Once a bit is
  # set in this field it should be set on sub-sequent updates of the page. ROM emulates One Time Programmable (OTP) bits
  # behavior during CFPA-CMAC update. Compared to current value, if the new value has bit cleared, then the update is
  # rejected and CMAC signing is skipped.
  MFLAG_CUST_3: '0x0000_0000'
  # ----------------------------------------===== MFLAG_CUST_4 [Optional] =====-----------------------------------------
  # Description: Offset: 0x000000B0, Width: 32b; Customer defined Monotonic flags 4 for application use. Once a bit is
  # set in this field it should be set on sub-sequent updates of the page. ROM emulates One Time Programmable (OTP) bits
  # behavior during CFPA-CMAC update. Compared to current value, if the new value has bit cleared, then the update is
