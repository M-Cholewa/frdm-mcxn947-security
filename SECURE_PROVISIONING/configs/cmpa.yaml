    # Description: Offset: 8b, Width: 2b, Enforce CNSA suite approved algorithms for secure boot, secure update and
    # debug authentication. Note, CMAC image authentication is only allowed in 2b'00 setting
    # - ALL_ALLOWED_0B00, (0): All algorithm allowed
    # - LIMITED_0B01, (1): Only ECC P-384 keys, SHA384 & AES256 algorithms are used
    # - LIMITED_0B10, (2): Only ECC P-384 keys, SHA384 & AES256 algorithms are used
    # - LIMITED_0B11, (3): Only ECC P-384 keys, SHA384 & AES256 algorithms are used
    # Possible options: <ALL_ALLOWED_0B00, LIMITED_0B01, LIMITED_0B10, LIMITED_0B11>
    ENF_CNSA: RAW:0b00
    # --------------------------------------===== ENF_TZM_PRESET [Optional] =====---------------------------------------
    # Description: Offset: 10b, Width: 2b, Enforce TrustZone-M mode
    # - IGNORE_0B00, (0): Ignored
