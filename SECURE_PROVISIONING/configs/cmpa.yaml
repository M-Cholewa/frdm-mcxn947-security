  # ---------------------------------------===== SECURE_BOOT_CFG [Optional] =====---------------------------------------
  # Description: Offset: 0x00000050, Width: 32b; Secure Boot Configuration
  SECURE_BOOT_CFG:
    # ----------------------------------------===== SEC_BOOT_EN [Optional] =====----------------------------------------
    # Description: Offset: 0b, Width: 2b, Secure boot enforcement. This field defines the minimum image verification
    # procedure (CRC32, CMAC, ECDSA sign). The Image type field in header indicates the type of verification data
    # (checksum or signature) included in it. Note: Plain < CRC32 < CMAC < ECDSA
    # - ALL_IMAGES, (0): All Image types are allowed
    # - CRC32_IMAGES, (1): Only CRC32 or signed (CMAC or ECDSA) images are allowed
    # - SIGNED_IMAGES, (2): Only Signed (CMAC or ECDSA) images are allowed
    # - ECDSA_SIGNED, (3): Only ECDSA signed images are allowed
    # Possible options: <ALL_IMAGES, CRC32_IMAGES, SIGNED_IMAGES, ECDSA_SIGNED>
    SEC_BOOT_EN: RAW:0b11
    # ----------------------------------------===== LP_SEC_BOOT [Optional] =====----------------------------------------
    # Description: Offset: 3b, Width: 2b, Secure boot option for low-power wake from power-down and deep-powerdown. For
    # CFPA/CMPA do CRC check always
    # - COLD_BOOT, (0): Same as cold boot
    # - CHECK_CRC32, (1): CRC check for CFPA/CMPA & CRC32 check of active image
    # - CHECK_JUMP, (2): CRC check for CFPA/CMPA & jump to vector address specified in CFPA
    # - CMAC_CHECK, (3): CRC check for CFPA/CMPA & CMAC check of active image
    # Possible options: <COLD_BOOT, CHECK_CRC32, CHECK_JUMP, CMAC_CHECK>
    LP_SEC_BOOT: RAW:0b00
